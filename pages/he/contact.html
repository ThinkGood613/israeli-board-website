<section class="page-header">

<section class="section">
  <div class="container">
    <div class="grid grid-2" style="align-items:start">
      <form class="card" data-demo data-success="תודה. ההודעה נשלחה.">
        <h2 class="mt-0" style="font-size:1.4rem">שליחת הודעה</h2>
        <div class="form-grid cols-2">
          <div class="field"><label for="f-name">שם מלא</label><input id="f-name" name="name" autocomplete="name" required></div>

          <div class="field"><label for="f-phone">טלפון</label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>

              <option>הגשת בקשה</option><option>בחינה</option><option>חידוש / השתלמויות</option><option>אימות הסמכה</option><option>הכרה כספק השתלמויות</option><option>תקשורת</option><option>אחר</option>
            </select>
          </div>
        </div>
        <div class="field"><label for="f-msg">הודעה</label><textarea id="f-msg" name="message" rows="6" required></textarea></div>
        <p class="form-note">להגשת תלונה על איש מקצוע, השתמשו ב<a href="ethics.html#complaint">טופס התלונה</a>.</p>

        <p class="form-status" role="status"></p>

      <div class="card">
        <h2 class="mt-0" style="font-size:1.4rem">משרדי המועצה</h2>

        <p><strong>טלפון:</strong> <a class="ltr" href="tel:+97230000000">03-000-0000</a><br>
           <strong>דוא"ל:</strong> <a href="mailto:info@example.org.il">info@example.org.il</a></p>
        <p><strong>שעות פעילות:</strong> ימים א'–ה', 9:00–15:00</p>
        <p class="muted">השירות ניתן בעברית, בערבית, באנגלית וברוסית.</p>
      </div>
    </div>
  </div>
